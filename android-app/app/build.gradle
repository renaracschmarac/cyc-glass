plugins {
    id "com.android.application"
}

android {
    namespace "com.cycglass.monitor"
    compileSdk 35

    defaultConfig {
        applicationId "com.cycglass.monitor"
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName "0.3.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Map tile source for the dynamic GPS-centered map background
        // (see docs/2026-06-01-map-background-plan.md). One of:
        //   "OSM"        — OpenStreetMap raster, no API key (v1 default)
        //   "STADIA"     — Stadia Maps raster, needs MAP_TILE_API_KEY
        //   "MAPTILER"   — MapTiler raster, needs MAP_TILE_API_KEY
        // The escape hatch to a paid provider is a one-line change in
        // MapTileSource.java; the runtime app code is provider-agnostic.
        buildConfigField "String", "MAP_TILE_SOURCE", "\"OSM\""
        // The API key is read from local.properties at build time so it
        // never lands in the repo. Default is the empty string, which
        // MapTileSource treats as "no key" and refuses to build a
        // STADIA/MAPTILER source without one.
        def mapTileApiKey = (project.findProperty("MAP_TILE_API_KEY")
                ?: System.getenv("MAP_TILE_API_KEY")
                ?: "").toString()
        buildConfigField "String", "MAP_TILE_API_KEY", "\"${mapTileApiKey}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    sourceSets {
        // Copy data/cyc_uart.json (the project-root source of truth) into
        // assets/ on every build so the runtime asset and the version-
        // controlled data layout cannot drift.
        main {
            assets.srcDirs += ["${rootDir}/../../data"]
        }
    }
}

task verifyLayoutAssetConsistency {
    doLast {
        def root = file("${rootDir}/../../data/cyc_uart.json")
        def asset = file("src/main/assets/cyc_uart.json")
        if (!root.exists() || !asset.exists()) return
        def rootBytes = root.bytes
        def assetBytes = asset.bytes
        if (rootBytes.length != assetBytes.length || !rootBytes.equals(assetBytes)) {
            throw new GradleException("data/cyc_uart.json and src/main/assets/cyc_uart.json differ; copy the data file to assets/ to keep them in sync.")
        }
    }
}

tasks.matching { it.name == "preBuild" }.configureEach {
    dependsOn verifyLayoutAssetConsistency
}

dependencies {
    // Map background (raster tile renderer). osmdroid is Apache-2,
    // mature, single dep, supports any ITileSource. See
    // docs/2026-06-01-map-background-plan.md for the rationale.
    implementation "org.osmdroid:osmdroid-android:6.1.18"

    // FusedLocationProviderClient for GPS — 1 Hz, displacement-thresholded,
    // foreground-only. We use the BOM so the play-services-* versions
    // stay in sync with each other.
    implementation "com.google.android.gms:play-services-location:21.3.0"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}
